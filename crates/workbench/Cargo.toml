[package]
name = "strata-workbench"
description = "Application layer: detector catalog, background jobs, use cases shared by GUI and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strata-kernel.workspace = true
strata-source.workspace = true
strata-engine.workspace = true
strata-case.workspace = true
strata-accounts = { path = "../accounts" }
strata-chain = { path = "../chain" }
strata-crypto = { path = "../crypto" }
strata-fs.workspace = true
strata-volume.workspace = true
strata-identify = { path = "../identify" }
strata-carve = { path = "../carve" }
strata-index = { path = "../index" }
strata-archive.workspace = true
strata-artifacts = { path = "../artifacts" }
strata-mail.workspace = true
strata-timeline = { path = "../timeline" }
strata-leads = { path = "../leads" }
strata-trails = { path = "../trails" }
strata-graph = { path = "../graph" }
strata-machines = { path = "../machines" }
strata-consistency = { path = "../consistency" }
strata-report = { path = "../report" }
strata-search.workspace = true
sha2.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance"] }

[dev-dependencies]
tempfile.workspace = true
strata-fs = { workspace = true, features = ["testkit"] }
rusqlite.workspace = true
strata-identify = { path = "../identify" }

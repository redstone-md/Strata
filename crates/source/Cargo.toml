[package]
name = "strata-source"
description = "Evidence byte sources: raw images, R-Studio .rdr, physical drives"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strata-kernel.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
